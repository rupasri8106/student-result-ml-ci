name: Student Result ML CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Keep your existing training and testing steps here.

      - name: Upload validated ML artifacts
        uses: actions/upload-artifact@v6
        with:
          name: student-result-ml-artifacts
          path: |
            student_result_model.pkl
            metrics.json
          if-no-files-found: warn
          retention-days: 7
